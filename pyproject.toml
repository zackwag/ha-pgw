[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-pgw"
version = "1.0.0"
description = "Home Assistant integration for Philadelphia Gas Works (PGW)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "zackwag"},
]
dependencies = [
    "pgw-api==1.0.0",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]
